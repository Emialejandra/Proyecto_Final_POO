spring.application.name=estudiante

# Configuración de la conexión a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/instituto
spring.datasource.username=root
spring.datasource.password=2004Franzu
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA y Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Diferir la carga de datos hasta que las tablas existan
spring.jpa.defer-datasource-initialization=true

# Inicialización de SQL
spring.sql.init.mode=always
